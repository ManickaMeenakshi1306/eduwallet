<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskAligner - Settings</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo" style="margin-bottom: 1.5rem;">TaskAligner</div>
    <button class="new-btn" onclick="window.location='wallet.html'">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
      New
    </button>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="wallet.html" class="nav-item"><i data-lucide="hard-drive"></i> My Drive</a>
      <a href="forums.html" class="nav-item"><i data-lucide="users"></i> Shared Hub</a>
      <a href="summarizer.html" class="nav-item"><i data-lucide="file-text"></i> Summarizer</a>
      <a href="settings.html" class="nav-item active"><i data-lucide="settings"></i> Settings</a>
    </nav>
    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--glass-border);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="avatar" id="userInitial">U</div>
        <div style="overflow: hidden;">
          <div style="font-weight: 600; font-size: 0.85rem; white-space: nowrap; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 0.7rem; color: #1967d2;">Storage: 2.4 GB / 15 GB</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-bar">
      <h1>Settings</h1>
    </header>

    <div class="glass-card" style="max-width: 600px; padding: 2rem; background: #fff; border: 1px solid #e0e0e0; box-shadow: none;">
      <h3 style="margin-top: 0; margin-bottom: 1.5rem;">Profile Settings</h3>
      
      <label style="color: #5f6368; font-size: 0.8rem;">Display Name</label>
      <input type="text" id="newName" placeholder="Enter new username" style="margin-bottom: 1.5rem;">
      
      <div style="background: #f8f9fa; border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid #e0e0e0;">
        <div style="font-size: 0.8rem; color: #5f6368; margin-bottom: 4px;">Credits Earned</div>
        <div style="font-size: 1.5rem; font-weight: 700; color: #1a73e8;" id="settingsCredits">0 C</div>
        <p style="font-size: 0.75rem; color: #70757a; margin-top: 8px;">Earn more credits by sharing assets and engaging in discussions.</p>
      </div>

      <button class="primary-btn" onclick="updateProfile()">Save Changes</button>

      <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #f1f3f4;">
        <h3 style="color: #d93025; font-size: 1rem;">Danger Zone</h3>
        <p style="font-size: 0.85rem; color: #5f6368; margin-bottom: 1.5rem;">Once you logout, you will need your credentials to sign back in.</p>
        <button class="primary-btn" style="background: #fff; border: 1px solid #d93025; color: #d93025;" onclick="logout()">
          Sign Out
        </button>
      </div>
    </div>
  </main>
</div>

<script>
  lucide.createIcons();
  const user_id = localStorage.getItem("user_id");
  const username = localStorage.getItem("username") || "User";
  document.getElementById("userName").innerText = username;
  document.getElementById("userInitial").innerText = username.charAt(0).toUpperCase();
  document.getElementById("newName").value = username;

  async function loadProfile() {
    try {
      const res = await fetch(`http://127.0.0.1:8000/auth/profile/${user_id}`);
      const data = await res.json();
      document.getElementById("settingsCredits").innerText = `${data.credits || 0} C`;
    } catch (err) {}
  }
  loadProfile();

  async function updateProfile() {
    const name = document.getElementById("newName").value;
    if (!name) return;
    try {
      const res = await fetch(`http://127.0.0.1:8000/auth/set_username`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: user_id, username: name })
      });
      if (res.ok) {
        localStorage.setItem("username", name);
        location.reload();
      }
    } catch (err) { alert("Failed to update"); }
  }

  function logout() {
    localStorage.clear();
    window.location = "index.html";
  }
</script>
</body>
</html>

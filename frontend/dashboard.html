<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskAligner - Command Center</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo" style="margin-bottom: 1.5rem;">EduWallet</div>
    
    <button class="new-btn" onclick="document.getElementById('dashUpload').click()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
      New
    </button>
    <input type="file" id="dashUpload" style="display: none;" onchange="uploadToWallet(this)">

    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item active"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="wallet.html" class="nav-item"><i data-lucide="hard-drive"></i> My Drive</a>
      <a href="forums.html" class="nav-item"><i data-lucide="users"></i> Shared Hub</a>
      <a href="summarizer.html" class="nav-item"><i data-lucide="file-text"></i> Summarizer</a>
      <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
    </nav>

    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--glass-border);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="avatar" id="userInitial">U</div>
        <div style="overflow: hidden;">
          <div style="font-weight: 600; font-size: 0.85rem; white-space: nowrap; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 0.7rem; color: #1967d2;">Storage: 2.4 GB / 15 GB</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-bar">
      <h1 id="welcomeText">Welcome back!</h1>
    </header>

    <!-- QUICK STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Active Tasks</span>
        <span class="stat-value" id="activeTasks">12</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Balance</span>
        <span class="stat-value" id="totalCredits">0 C</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Trust Score</span>
        <span class="stat-value">98%</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr; gap: 2rem;">
      <div>
        <div class="glass-card" style="border: none; box-shadow: none; background: transparent; padding: 0;">
          <h2 style="font-size: 1.1rem; margin-bottom: 1.5rem; font-weight: 500;">Recent Uploads</h2>
          <div id="recentUploads" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;">
            <!-- Populated by wallet.js -->
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/wallet.js"></script>
<script src="js/components.js"></script>
<script>
  lucide.createIcons();
  const user_id = localStorage.getItem("user_id");
  const username = localStorage.getItem("username") || "User";
  document.getElementById("welcomeText").innerText = `Welcome back, ${username}!`;
  document.getElementById("userName").innerText = username;
  document.getElementById("userInitial").innerText = username.charAt(0).toUpperCase();

  if (user_id) {
    fetch(`http://127.0.0.1:8000/auth/profile/${user_id}`)
      .then(res => res.json())
      .then(data => {
        const creditEl = document.getElementById("totalCredits");
        if (creditEl) creditEl.innerText = `${data.credits || 0} C`;
      });
  }

  function logout() {
    localStorage.clear();
    window.location = "index.html";
  }

  // Animate progress bars on load
  window.onload = () => {
    setTimeout(() => {
      document.querySelectorAll('.progress-bar').forEach(bar => {
        const width = bar.style.width;
        bar.style.width = '0';
        setTimeout(() => bar.style.width = width, 100);
      });
    }, 500);
  };
</script>
</body>
</html>

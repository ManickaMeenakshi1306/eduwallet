<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskAligner - Forum Discussion</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo" style="margin-bottom: 1.5rem;">TaskAligner</div>
    <button class="new-btn" onclick="window.location='wallet.html'">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
      New
    </button>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="wallet.html" class="nav-item"><i data-lucide="hard-drive"></i> My Drive</a>
      <a href="forums.html" class="nav-item active"><i data-lucide="users"></i> Shared Hub</a>
      <a href="summarizer.html" class="nav-item"><i data-lucide="file-text"></i> Summarizer</a>
      <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
    </nav>
    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--glass-border);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="avatar" id="userInitial">U</div>
        <div style="overflow: hidden;">
          <div style="font-weight: 600; font-size: 0.85rem; white-space: nowrap; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 0.7rem; color: #1967d2;">Storage: 2.4 GB / 15 GB</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-bar">
      <h1 id="forumTitle" style="display: flex; align-items: center; gap: 12px;">
        <i data-lucide="users" style="color: var(--primary);"></i> Forum Discussion
      </h1>
      <div style="display: flex; gap: 10px;">
        <button class="primary-btn" style="background: #fff; color: #5f6368; border: 1px solid #dadce0;" onclick="openMemberModal()">
          <i data-lucide="user-plus"></i> Add Member
        </button>
        <button class="primary-btn" onclick="openShareModal()">
          <i data-lucide="plus"></i> Share Asset
        </button>
      </div>
    </header>

    <div id="notesContainer">
      <!-- Notes generated here -->
    </div>
  </main>
</div>

<!-- Share Modal -->
<div id="shareModal" class="modal">
  <div class="modal-content" style="max-width: 500px; height: auto; padding: 2rem;">
    <div class="modal-header" style="border: none; padding: 0 0 1rem 0;">
      <h3 style="margin: 0; color: var(--primary);">Share with Community</h3>
      <span class="close-btn" onclick="closeShareModal()">&times;</span>
    </div>
    
    <label style="color: var(--text-muted); font-size: 0.8rem;">Description</label>
    <textarea id="description" placeholder="What's this asset about?" style="height: 100px;"></textarea>
    
    <label style="color: var(--text-muted); font-size: 0.8rem;">Tags (comma separated)</label>
    <input id="tags" placeholder="e.g. tutorial, notes, resources">

    <div style="margin: 1.5rem 0; padding: 2rem; border: 1px dashed var(--glass-border); border-radius: 8px; text-align: center; cursor: pointer; background: #fafafa;" onclick="document.getElementById('file').click()">
      <i data-lucide="upload" style="margin-bottom: 8px; color: var(--primary);"></i>
      <div style="font-weight: 600;">Select File</div>
      <input type="file" id="file" style="display: none;">
    </div>

    <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      <input type="checkbox" id="downloadable" style="width: 16px; height: 16px; margin: 0;"> 
      Allow others to download
    </label>
    
    <div style="display: flex; gap: 10px;">
      <button class="primary-btn" onclick="uploadNote()" style="flex: 1;">Post</button>
      <button class="primary-btn" style="background: #eee; color: #333; flex: 1;" onclick="closeShareModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Live Preview Modal -->
<div id="previewModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="previewTitle" style="margin: 0;">File Preview</h3>
      <span class="close-btn" onclick="closeLivePreview()">&times;</span>
    </div>
    <iframe id="previewFrame" src="" style="flex: 1; border: none;"></iframe>
  </div>
</div>

<!-- Member Modal -->
<div id="memberModal" class="modal">
  <div class="modal-content" style="max-width: 400px; height: auto; padding: 2rem;">
    <div class="modal-header" style="border: none; padding: 0 0 1rem 0;">
      <h3 style="margin: 0; color: var(--primary);">Add Community Member</h3>
      <span class="close-btn" onclick="closeMemberModal()">&times;</span>
    </div>
    <label style="color: var(--text-muted); font-size: 0.8rem;">Enter User ID</label>
    <input id="memberUserId" placeholder="e.g. user_123...">
    <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
      <button class="primary-btn" onclick="addForumMember()" style="flex: 1;">Add to Hub</button>
      <button class="primary-btn" style="background: #eee; color: #333; flex: 1;" onclick="closeMemberModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  lucide.createIcons();
  loadNotes();

  const username = localStorage.getItem("username") || "User";
  document.getElementById("userName").innerText = username;
  document.getElementById("userInitial").innerText = username.charAt(0).toUpperCase();

  // Set forum name from URL
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  if (name) document.getElementById('forumTitle').innerHTML = `<i data-lucide="users" style="color: var(--primary);"></i> ${name}`;
  lucide.createIcons();

  function logout() {
    localStorage.clear();
    window.location = "index.html";
  }

  function openShareModal() {
    document.getElementById('shareModal').style.display = 'flex';
  }

  function closeShareModal() {
    document.getElementById('shareModal').style.display = 'none';
  }

  function openMemberModal() {
    document.getElementById('memberModal').style.display = 'flex';
  }

  function closeMemberModal() {
    document.getElementById('memberModal').style.display = 'none';
  }

  async function addForumMember() {
    const forum_id = localStorage.getItem("forum_id");
    const user_id = document.getElementById("memberUserId").value;
    if (!user_id) return alert("User ID required");

    try {
      const res = await fetch(`http://127.0.0.1:8000/forum/add-member?forum_id=${forum_id}&user_id=${user_id}`);
      const data = await res.json();
      if (res.ok) {
        alert("Member added to community! ✅");
        closeMemberModal();
      } else {
        alert(data.detail || "Failed to add member ❌");
      }
    } catch (err) {
      alert("Server error ❌");
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskAligner - Secure Upload</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo" style="font-size: 2rem; margin-bottom: 1rem;">TaskAligner</div>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem;">Command Center</p>
    
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="forums.html" class="nav-item"><i data-lucide="users"></i> Community</a>
      <a href="wallet.html" class="nav-item"><i data-lucide="wallet"></i> Wallet</a>
      <a href="upload.html" class="nav-item active"><i data-lucide="upload-cloud"></i> Uploads</a>
      <a href="#" class="nav-item"><i data-lucide="settings"></i> Settings</a>
    </nav>

    <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem;">
        <div class="avatar" id="userInitial">U</div>
        <div>
          <div style="font-weight: 600; font-size: 0.9rem;" id="userName">User</div>
          <div style="font-size: 0.75rem; color: var(--primary);">Verified Pro</div>
        </div>
      </div>
      <button class="primary-btn" style="background: rgba(255,50,50,0.1); color: #ff4444; padding: 10px;" onclick="logout()">
        <i data-lucide="log-out"></i> Logout
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-bar">
      <h1>Share with Community</h1>
    </header>

    <div class="glass-card" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
      <h3 style="margin-top: 0; margin-bottom: 1.5rem;">New Community Asset</h3>
      
      <div id="uploadStatus" class="message" style="margin-bottom: 1rem;"></div>
      
      <label style="color: var(--text-muted); font-size: 0.8rem;">Forum ID (optional)</label>
      <input id="forumId" placeholder="Enter target forum ID">
      
      <label style="color: var(--text-muted); font-size: 0.8rem;">Tags</label>
      <input id="tags" placeholder="e.g. engineering, design, notes">
      
      <label style="color: var(--text-muted); font-size: 0.8rem;">Description</label>
      <textarea id="description" placeholder="What are you sharing?" style="height: 100px; margin-bottom: 1rem;"></textarea>

      <div style="margin: 1.5rem 0; padding: 2rem; border: 1px dashed var(--glass-border); border-radius: 8px; text-align: center; cursor: pointer; background: #fafafa;" 
           onclick="document.getElementById('file').click()">
        <i data-lucide="upload" style="width: 32px; height: 32px; margin-bottom: 10px; color: var(--primary);"></i>
        <div style="font-weight: 600; font-size: 1rem;">Select a file</div>
        <input type="file" id="file" style="display: none;">
      </div>

      <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; font-size: 0.85rem; color: var(--text-muted);">
        <input type="checkbox" id="downloadable" style="width: 16px; height: 16px; margin: 0;"> 
        Allow others to download this asset
      </label>

      <button class="primary-btn" onclick="uploadNote()" style="width: 100%;">
        Upload to Hub
      </button>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  lucide.createIcons();
  const username = localStorage.getItem("username") || "User";
  document.getElementById("userName").innerText = username;
  document.getElementById("userInitial").innerText = username.charAt(0).toUpperCase();

  function logout() {
    localStorage.clear();
    window.location = "index.html";
  }
</script>
</body>
</html>

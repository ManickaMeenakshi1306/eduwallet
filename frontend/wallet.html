<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskAligner - My Wallet</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo" style="margin-bottom: 1.5rem;">TaskAligner</div>
    
    <button class="new-btn" onclick="document.getElementById('walletFile').click()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
      New
    </button>
    <input type="file" id="walletFile" style="display: none;" onchange="uploadToWallet(this)">

    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="wallet.html" class="nav-item active"><i data-lucide="hard-drive"></i> My Drive</a>
      <a href="forums.html" class="nav-item"><i data-lucide="users"></i> Shared Hub</a>
      <a href="summarizer.html" class="nav-item"><i data-lucide="file-text"></i> Summarizer</a>
      <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
    </nav>

    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--glass-border);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="avatar" id="userInitial">U</div>
        <div style="overflow: hidden;">
          <div style="font-weight: 600; font-size: 0.85rem; white-space: nowrap; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 0.7rem; color: #1967d2;">Storage: 2.4 GB / 15 GB</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-bar" style="justify-content: flex-start; gap: 2rem;">
      <h1 style="min-width: 150px;">My Drive</h1>
      <div style="flex: 1; max-width: 600px; position: relative;">
        <i data-lucide="search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #5f6368; width: 18px;"></i>
        <input type="text" id="fileSearch" placeholder="Search in Drive" style="background: #f1f3f4; border: none; padding: 12px 12px 12px 45px; border-radius: 8px; margin: 0; font-size: 1rem; color: #3c4043;" oninput="searchFiles(this.value)">
      </div>
      <button class="primary-btn" style="width: auto; padding: 8px 16px; font-size: 0.85rem; background: #fff; border: 1px solid #dadce0; color: #1a73e8; display: flex; align-items: center; gap: 8px;" onclick="document.getElementById('walletFile').click()">
        <i data-lucide="upload-cloud" style="width: 18px;"></i> Upload
      </button>
      <div style="display: flex; align-items: center; gap: 1rem; margin-left: auto;">
        <div id="userCredits" style="font-weight: 700; color: var(--primary);">0 C</div>
        <i data-lucide="help-circle" style="color: #5f6368; cursor: pointer; width: 20px;"></i>
        <i data-lucide="settings" style="color: #5f6368; cursor: pointer; width: 20px;" onclick="window.location='settings.html'"></i>
        <i data-lucide="info" style="color: #5f6368; cursor: pointer; width: 20px;"></i>
      </div>
    </header>

    <div id="walletList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem;">
      <!-- Wallet files populated by wallet.js -->
    </div>
  </main>
</div>

<!-- Live Preview Modal -->
<div id="previewModal" class="modal">
  <div class="modal-content" style="max-width: 1000px; height: 85%;">
    <div class="modal-header">
      <h3 id="previewTitle" style="margin: 0;">File Preview</h3>
      <span class="close-btn" onclick="closeLivePreview()">&times;</span>
    </div>
    <iframe id="previewFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
  </div>
</div>

<script src="js/wallet.js"></script>
<script>
  lucide.createIcons();
  const username = localStorage.getItem("username") || "User";
  document.getElementById("userName").innerText = username;
  document.getElementById("userInitial").innerText = username.charAt(0).toUpperCase();
  loadWallet();

  function logout() {
    localStorage.clear();
    window.location = "index.html";
  }
</script>
</body>
</html>

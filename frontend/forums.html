<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskAligner - Community Forums</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo" style="margin-bottom: 1.5rem;">TaskAligner</div>
    <button class="new-btn" onclick="window.location='wallet.html'">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
      New
    </button>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="wallet.html" class="nav-item"><i data-lucide="hard-drive"></i> My Drive</a>
      <a href="forums.html" class="nav-item active"><i data-lucide="users"></i> Shared Hub</a>
      <a href="summarizer.html" class="nav-item"><i data-lucide="file-text"></i> Summarizer</a>
      <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
    </nav>
    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--glass-border);">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="avatar" id="userInitial">U</div>
        <div style="overflow: hidden;">
          <div style="font-weight: 600; font-size: 0.85rem; white-space: nowrap; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 0.7rem; color: #1967d2;">Storage: 2.4 GB / 15 GB</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="top-bar">
      <h1>Community Hub</h1>
      <button class="primary-btn" onclick="openCreateModal()">
        <i data-lucide="plus"></i> Start Discussion
      </button>
    </header>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
      <div id="forumsContainer" style="display: grid; grid-template-columns: 1fr; gap: 1.5rem;">
        <!-- Forums populated by forum.js -->
      </div>

      <!-- MEMBERS SIDEBAR -->
      <aside>
        <div class="glass-card" style="padding: 1.5rem; background: #fff; border: 1px solid #e0e0e0; box-shadow: none; border-radius: 12px;">
          <h3 style="margin-top: 0; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 10px;">
            <i data-lucide="users" style="color: #1a73e8;"></i> Community Members
          </h3>
          <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 1.5rem;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="avatar" style="width: 32px; height: 32px; font-size: 0.8rem;">JD</div>
              <div style="flex: 1;">
                <div style="font-size: 0.85rem; font-weight: 600;">Jane Doe</div>
                <div style="font-size: 0.7rem; color: #5f6368;">1,250 Assets Shared</div>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="avatar" style="width: 32px; height: 32px; font-size: 0.8rem; background: #e8f0fe; color: #1967d2;">MS</div>
              <div style="flex: 1;">
                <div style="font-size: 0.85rem; font-weight: 600;">Mark Smith</div>
                <div style="font-size: 0.7rem; color: #5f6368;">840 Assets Shared</div>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="avatar" style="width: 32px; height: 32px; font-size: 0.8rem; background: #fce8e6; color: #d93025;">AK</div>
              <div style="flex: 1;">
                <div style="font-size: 0.85rem; font-weight: 600;">Alice Kim</div>
                <div style="font-size: 0.7rem; color: #5f6368;">520 Assets Shared</div>
              </div>
            </div>
          </div>
          <button class="primary-btn" style="margin-top: 1.5rem; width: 100%; background: #fff; border: 1px solid #dadce0; color: #1a73e8; font-size: 0.85rem;">
            View All Members
          </button>
        </div>
      </aside>
    </div>
  </main>
</div>

<!-- Create Modal -->
<div id="createModal" class="modal">
  <div class="modal-content" style="max-width: 500px; height: auto; padding: 2rem;">
    <div class="modal-header" style="border: none; padding: 0 0 1rem 0;">
      <h3 style="margin: 0; color: var(--primary);">New Discussion Group</h3>
      <span class="close-btn" onclick="closeCreateModal()">&times;</span>
    </div>
    <input id="forumName" placeholder="Forum Name">
    <textarea id="forumDesc" placeholder="Brief Description" style="height: 120px;"></textarea>
    <div style="display: flex; gap: 10px; margin-top: 1rem;">
      <button class="primary-btn" onclick="createForum()" style="flex: 1;">Create Hub</button>
      <button class="primary-btn" style="background: #eee; color: #333; flex: 1;" onclick="closeCreateModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="js/forum.js"></script>
<script>
  lucide.createIcons();
  const username = localStorage.getItem("username") || "User";
  document.getElementById("userName").innerText = username;
  document.getElementById("userInitial").innerText = username.charAt(0).toUpperCase();

  function logout() {
    localStorage.clear();
    window.location = "index.html";
  }
</script>
</body>
</html>
